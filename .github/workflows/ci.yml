name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Daily rebuild with fresh APOD data. APOD publishes around midnight US Eastern time.
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck:scripts
      - run: npm test
      - run: npm run test:scripts
      # The library must stay publishable on its own, not just usable from the app.
      - run: npm run build:lib
      # Real data needs the NASA_API_KEY secret, which pull requests don't get: they build with the sample.
      # On master, a failed fetch falls back to the currently deployed snapshot; with no real data at all,
      # --strict fails the run and the live site keeps its previous deployment.
      - name: Fetch APOD snapshot
        run: npm run data:fetch -- $STRICT
        env:
          STRICT: ${{ github.event_name != 'pull_request' && '--strict' || '' }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          APOD_FALLBACK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/apod.json
      # The base href follows the repository name, so the build keeps working after a rename.
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages serves 404.html for unknown paths: this lets deep links reach the Angular router.
      - run: cp dist/cosmos-stories/browser/index.html dist/cosmos-stories/browser/404.html
      # Every story in the snapshot also gets its own page, so shared links load with 200 OK.
      - run: node scripts/story-pages.ts
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: dist/cosmos-stories/browser

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:build
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e:build
      # Accessibility, best practices, SEO and layout stability are hard gates;
      # the performance score is a gate at 85 and a warning below 95 (see lighthouserc.json).
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
