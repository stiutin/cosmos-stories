name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or story URL
      placeholder: https://stiutin.github.io/cosmos-stories/stories/latest/2026-09-22
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15 / Chrome 142 on Windows 11
    validations:
      required: true
